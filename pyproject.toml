[project]
name = "cybersahay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "einops>=0.8.2",
    "faiss-cpu>=1.14.3",
    "groq>=0.37.1",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "typesense>=2.0.0",
    "torch",
    "fastapi>=0.143.0",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.51",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "reportlab>=5.0.1",
    "python-multipart>=0.0.32",
    "numpy>=2.5.1",
    "pandas>=3.0.6",
    "easyocr>=1.7.2",
    "pillow>=12.3.0",
    "opencv-python-headless>=5.0.0.93",
]
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
